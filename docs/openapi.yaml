  /api/v1/admin/loans/{id}/disburse:
    parameters:
      - $ref: '#/components/parameters/ResourceID'
    post:
      tags: [Loans]
      operationId: disburseAdminLoan
      x-permission: kasbon.cairkan
      summary: Cairkan kasbon approved sekali saja
      description: Perlu reauth. Referensi sama dapat diulang secara idempotent. Cicilan pertama jatuh pada periode bulan setelah pencairan, memakai zona waktu tenant.
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [disbursement_ref]
              properties:
                disbursement_ref: { type: string, minLength: 1, maxLength: 160 }
      responses:
        '200': { description: Kasbon cair atau retry dengan referensi yang sama }
        '403': { description: Reauth diperlukan }
        '409': { description: Belum approved atau sudah cair dengan referensi lain }
  /api/v1/admin/loans/{id}/installments/{seq}/waive:
    parameters:
      - $ref: '#/components/parameters/ResourceID'
      - { in: path, name: seq, required: true, schema: { type: integer, minimum: 1, maximum: 120 } }
    post:
      tags: [Loans]
      operationId: waiveLoanInstallment
      x-permission: kasbon.kelola
      summary: Bebaskan satu cicilan pending dan kurangi kewajiban
      description: Perlu reauth dan kasbon.lihat dalam scope. Cicilan yang sudah terhubung ke payroll tidak dapat dibebaskan.
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 1, maxLength: 2000 }
      responses:
        '200': { description: Cicilan waived dan outstanding berkurang }
        '403': { description: Permission atau reauth diperlukan }
        '409': { description: Cicilan telah diproses atau dikunci payroll }
  /api/v1/admin/loans/{id}/settle:
    parameters:
      - $ref: '#/components/parameters/ResourceID'
    post:
      tags: [Loans]
      operationId: settleAdminLoan
      x-permission: kasbon.kelola
      summary: Catat pelunasan penuh di luar payroll
      description: Perlu reauth dan kasbon.lihat dalam scope. settlement_ref unik per tenant; retry identik idempotent. Semua cicilan pending ditutup. Cicilan yang terhubung ke payroll memblokir pelunasan.
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [settlement_ref]
              properties:
                settlement_ref: { type: string, minLength: 1, maxLength: 160 }
      responses:
        '200': { description: Seluruh sisa kasbon lunas atau retry identik }
        '403': { description: Permission atau reauth diperlukan }
        '409': { description: Status konflik, payroll terkunci, atau referensi dipakai }
  /api/v1/admin/loan-policies:
    get:
      tags: [Loans]
      operationId: getLoanPolicy
      x-permission: kasbon.kelola
      responses:
        '200': { description: Kebijakan tenant atau configured false }
    put:
      tags: [Loans]
      operationId: putLoanPolicy
      x-permission: kasbon.kelola
      summary: Atur plafon total sisa kasbon dan tenor maksimum
      description: Perlu reauth. Gunakan version 0 saat membuat dan versi terbaru untuk memperbarui.
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [max_outstanding, max_tenor_months, version]
              properties:
                max_outstanding: { type: number, exclusiveMinimum: 0, description: Nominal maksimal total eksposur kasbon dalam desimal dua digit }
                max_tenor_months: { type: integer, minimum: 1, maximum: 120 }
                version: { type: integer, minimum: 0 }
      responses:
        '200': { description: Kebijakan tersimpan dan diaudit }
        '403': { description: Reauth diperlukan }
        '409': { description: Versi kebijakan berubah }
  /api/v1/ess/reimbursements:
    get:
      tags: [Reimbursements]
      operationId: listEssReimbursements
      summary: Daftar klaim milik karyawan yang masuk
      parameters:
        - { in: query, name: status, schema: { type: string } }
        - { in: query, name: category_id, schema: { type: string } }
        - { in: query, name: from, schema: { type: string, format: date } }
        - { in: query, name: to, schema: { type: string, format: date } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200': { description: Daftar klaim sendiri, termasuk kategori yang kemudian dinonaktifkan }
    post:
      tags: [Reimbursements]
      operationId: submitEssReimbursement
      x-permission: reimbursement.buat
      summary: Ajukan klaim dengan kuitansi terverifikasi dan approval default
      description: Batas bulanan dihitung per karyawan, kategori, dan bulan transaksi. Klaim serupa berdasarkan karyawan, tanggal, nominal, dan hash isi kuitansi perlu confirm_duplicate true.
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReimbursementInput' }
      responses:
        '201': { description: Klaim dan tugas approver dibuat dalam satu transaksi }
        '409': { description: DUPLICATE_SUSPECTED, batas bulanan, kuitansi terpakai, atau alur approval belum tersedia }
  /api/v1/ess/reimbursements/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceID'
    get:
      tags: [Reimbursements]
      operationId: getEssReimbursement
      summary: Detail klaim sendiri dan metadata kuitansi
      responses:
        '200': { description: Klaim dan kuitansi tanpa storage key atau URL file }
        '404': { description: Klaim tidak ada atau bukan milik karyawan }
  /api/v1/ess/reimbursements/{id}/receipts:
    parameters:
      - $ref: '#/components/parameters/ResourceID'
    post:
      tags: [Reimbursements]
      operationId: addEssReimbursementReceipts
      summary: Tambah kuitansi pada klaim returned
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [file_ids]
              properties:
                file_ids: { type: array, minItems: 1, maxItems: 5, items: { type: string, minLength: 26, maxLength: 26 } }
      responses:
        '200': { description: 'Kuitansi ditambahkan; kirim ulang melalui /ess/requests/{requestId}/resubmit' }
        '409': { description: Klaim bukan returned atau kuitansi telah dipakai }
  /api/v1/admin/reimbursements:
    get:
      tags: [Reimbursements]
      operationId: listAdminReimbursements
      x-permission: reimbursement.lihat
      parameters:
        - { in: query, name: status, schema: { type: string } }
        - { in: query, name: category_id, schema: { type: string } }
        - { in: query, name: employee_id, schema: { type: string } }
        - { in: query, name: from, schema: { type: string, format: date } }
        - { in: query, name: to, schema: { type: string, format: date } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200': { description: Daftar klaim sesuai scope karyawan }
  /api/v1/admin/reimbursements/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceID'
    get:
      tags: [Reimbursements]
      operationId: getAdminReimbursement
      x-permission: reimbursement.lihat
      responses:
        '200': { description: Klaim dan metadata kuitansi dalam scope }
        '404': { description: Klaim tidak ditemukan dalam scope }
  /api/v1/admin/reimbursements/{id}/pay:
    parameters:
      - $ref: '#/components/parameters/ResourceID'
    post:
      tags: [Reimbursements]
      operationId: payAdminReimbursement
      x-permission: reimbursement.bayar
      summary: Tandai klaim approved dibayar satu kali
      description: Memerlukan reauth. Pengulangan dengan payment_ref yang sama mengembalikan hasil idempotent tanpa audit pembayaran baru.
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [payment_ref]
              properties:
                payment_ref: { type: string, minLength: 1, maxLength: 160 }
      responses:
        '200': { description: Klaim dibayar atau retry identik }
        '403': { description: Verifikasi ulang dibutuhkan }
        '409': { description: Klaim belum approved atau sudah dibayar dengan referensi lain }
  /api/v1/files/uploads:
    post:
      tags: [Files]
      operationId: createReceiptUpload
      x-permission: reimbursement.buat
      summary: Minta unggah kuitansi di staging
      description: Hanya purpose receipt, PNG/JPEG/PDF hingga 10 MiB. Penyimpanan lokal staging dibatasi 100 MiB per tenant. Endpoint tidak tersedia di luar staging.
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReceiptUploadInput' }
      responses:
        '201': { description: file_id, upload_url relatif, method PUT, headers, expires_at }
        '422': { description: Kuota staging terlampaui }
        '503': { description: Penyimpanan lokal tidak tersedia }
  /api/v1/files/{id}/content:
    parameters:
      - $ref: '#/components/parameters/ResourceID'
    get:
      tags: [Files]
      operationId: getReceiptContent
      summary: Unduh kuitansi melalui tautan sementara
      description: Dipakai oleh redirect download. Signature terikat sesi dan berlaku paling lama lima menit; hak file diperiksa ulang dan unduhan diaudit.
      parameters:
        - { in: query, name: expires, required: true, schema: { type: integer } }
        - { in: query, name: signature, required: true, schema: { type: string } }
      responses:
        '200': { description: Byte kuitansi }
        '403': { description: Tautan tidak sah atau kedaluwarsa }
    put:
      tags: [Files]
      operationId: putReceiptContent
      summary: Kirim byte kuitansi milik pengunggah
      description: Rute tambahan untuk adapter lokal staging; kirim Content-Type sesuai permintaan unggah dan X-CSRF-Token.
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/pdf: { schema: { type: string, format: binary } }
          image/jpeg: { schema: { type: string, format: binary } }
          image/png: { schema: { type: string, format: binary } }
      responses:
        '204': { description: Byte disimpan; panggil complete untuk verifikasi }
  /api/v1/files/{id}/complete:
    parameters:
      - $ref: '#/components/parameters/ResourceID'
    post:
      tags: [Files]
      operationId: completeReceiptUpload
      summary: Verifikasi ukuran, SHA-256, dan struktur isi kuitansi
      description: Validasi staging belum menggantikan pemindaian malware produksi. Berkas baru dapat dipakai klaim setelah complete berhasil.
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '200': { description: Kuitansi siap dipakai pada klaim }
        '422': { description: Isi tidak sesuai metadata yang dinyatakan }
  /api/v1/files/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceID'
    get:
      tags: [Files]
      operationId: getReceiptFile
      summary: Metadata kuitansi untuk pengunggah atau Admin dalam scope klaim
      responses:
        '200': { description: Metadata tanpa storage key }
        '404': { description: Berkas tidak ada atau di luar scope }
    delete:
      tags: [Files]
      operationId: deleteReceiptFile
      summary: Hapus kuitansi milik pengunggah yang belum terikat ke klaim
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '204': { description: Kuitansi bebas dihapus }
        '409': { description: Kuitansi sudah terikat ke klaim }
  /api/v1/files/{id}/download:
    parameters:
      - $ref: '#/components/parameters/ResourceID'
    get:
      tags: [Files]
      operationId: redirectReceiptDownload
      summary: Minta URL unduh sementara setelah cek akses
      responses:
        '302': { description: Redirect ke URL sesi sementara, berlaku lima menit }
        '404': { description: Kuitansi tidak ada atau di luar scope }
  /api/v1/admin/reimbursement-categories:
    get:
      tags: [Reimbursements]
      operationId: listReimbursementCategories
      x-permission: pengaturan.kelola
      parameters:
        - { in: query, name: q, schema: { type: string } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200': { description: Kategori tenant termasuk yang nonaktif }
    post:
      tags: [Reimbursements]
      operationId: createReimbursementCategory
      x-permission: pengaturan.kelola
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReimbursementCategoryInput' }
      responses:
        '201': { description: Kategori dibuat aktif }
        '409': { description: Kode kategori sudah dipakai }
  /api/v1/admin/reimbursement-categories/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceID'
    patch:
      tags: [Reimbursements]
      operationId: updateReimbursementCategory
      x-permission: pengaturan.kelola
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReimbursementCategoryPatch' }
      responses:
        '200': { description: Kategori diperbarui }
        '409': { description: Kode kategori sudah dipakai }
    delete:
      tags: [Reimbursements]
      operationId: deactivateReimbursementCategory
      x-permission: pengaturan.kelola
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '204': { description: Kategori dinonaktifkan tanpa menghapus klaim lama }
  /api/v1/admin/leave-types:
    get:
      tags: [Approvals]
      operationId: listAdminLeaveTypes
      x-permission: cuti.kelola
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200': { description: Jenis cuti termasuk yang nonaktif }
    post:
      tags: [Approvals]
      operationId: createAdminLeaveType
      x-permission: cuti.kelola
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LeaveTypeInput' }
      responses:
        '201': { description: Jenis cuti dibuat aktif }
        '409': { description: Kode sudah dipakai }
  /api/v1/admin/leave-types/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceID'
    patch:
      tags: [Approvals]
      operationId: updateAdminLeaveType
      summary: Ganti representasi jenis cuti lengkap
      x-permission: cuti.kelola
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LeaveTypeInput' }
      responses:
        '200': { description: Jenis cuti diperbarui }
        '409': { description: Kode sudah dipakai }
    delete:
      tags: [Approvals]
      operationId: deactivateAdminLeaveType
      x-permission: cuti.kelola
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '204': { description: Jenis cuti dinonaktifkan tanpa menghapus riwayat }
  /api/v1/admin/leave-policies:
    get:
      tags: [Approvals]
      operationId: listAdminLeavePolicies
      x-permission: cuti.kelola
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - { in: query, name: leave_type_id, schema: { type: string } }
      responses:
        '200': { description: Versi kebijakan cuti tenant }
    post:
      tags: [Approvals]
      operationId: createAdminLeavePolicy
      x-permission: cuti.kelola
      summary: Buat kebijakan manual tanpa masa berlaku yang bertumpang tindih
      description: Carry-over, masa kedaluwarsa, akrual otomatis, dan eligibility khusus menunggu keputusan aturan bisnis.
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [leave_type_id, accrual_type, valid_from]
              properties:
                leave_type_id: { type: string, minLength: 26, maxLength: 26 }
                accrual_type: { type: string, enum: [manual] }
                quota_days: { type: number, nullable: true, multipleOf: 0.01 }
                valid_from: { type: string, format: date }
                valid_to: { type: string, format: date, nullable: true }
      responses:
        '201': { description: Versi kebijakan dibuat }
        '409': { description: Masa berlaku bertumpang tindih }
  /api/v1/admin/leave-policies/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceID'
    patch:
      tags: [Approvals]
      operationId: endAdminLeavePolicy
      x-permission: cuti.kelola
      summary: Perpendek masa berlaku versi kebijakan
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [valid_to]
              properties:
                valid_to: { type: string, format: date }
      responses:
        '200': { description: Tanggal akhir diperbarui }
        '409': { description: Pengajuan aktif atau tanggal bertentangan }
    delete:
      tags: [Approvals]
      operationId: deactivateAdminLeavePolicy
      x-permission: cuti.kelola
      summary: Akhiri kebijakan kemarin dalam zona tenant
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '204': { description: Kebijakan berakhir tanpa menghapus riwayat }
        '409': { description: Kebijakan masa depan atau pengajuan aktif }
  /api/v1/admin/leave-balances/adjustments:
    post:
      tags: [Approvals]
      operationId: adjustAdminLeaveBalance
      x-permission: cuti.kelola
      summary: Penyesuaian ledger saldo dalam scope karyawan
      description: Membutuhkan autentikasi ulang, alasan, saldo tersedia tidak negatif, dan audit atomik. Nilai days boleh positif atau negatif dengan dua desimal.
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [employee_id, leave_type_id, days, effective_date, reason]
              properties:
                employee_id: { type: string, minLength: 26, maxLength: 26 }
                leave_type_id: { type: string, minLength: 26, maxLength: 26 }
                days: { type: number, multipleOf: 0.01 }
                effective_date: { type: string, format: date }
                reason: { type: string, minLength: 1, maxLength: 500 }
      responses:
        '201': { description: Mutasi ledger dibuat dan saldo tahun diperbarui }
        '403': { description: Autentikasi ulang diperlukan }
        '409': { description: Saldo tersedia akan negatif }
  /api/v1/admin/overtime-requests/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceID'
    get:
      tags: [Approvals]
      operationId: getAdminOvertimeRequest
      x-permission: lembur.lihat
      responses:
        '200': { description: Detail lembur dalam scope }
        '404': { description: Di luar tenant atau scope }
    patch:
      tags: [Approvals]
      operationId: updateAdminOvertimeRequest
      x-permission: lembur.ubah
      summary: Revisi draft atau lembur returned dalam scope
      description: Returned memerlukan version dan note. Revisi membuka ulang tugas tahap pertama pada request yang sama; bentrok tanggal dan shift diperiksa ulang.
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                version: { type: integer, minimum: 1 }
                note: { type: string, maxLength: 2000 }
                work_date: { type: string, format: date }
                proposed_minutes: { type: integer, minimum: 1, maximum: 1440 }
                reason: { type: string, minLength: 1, maxLength: 2000 }
                shift_instance_id: { type: string, nullable: true }
      responses:
        '200': { description: Draft diperbarui atau returned dikirim ulang }
        '409': { description: Status, versi, bentrok tanggal, atau approver tidak sesuai }
  /api/v1/admin/overtime-summary:
    get:
      tags: [Approvals]
      operationId: getAdminOvertimeSummary
      x-permission: lembur.lihat
      summary: Rekap usulan, persetujuan, dan menit dibayar per periode
      parameters:
        - { in: query, name: from, schema: { type: string, format: date } }
        - { in: query, name: to, schema: { type: string, format: date } }
        - { in: query, name: employee_id, schema: { type: string } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200': { description: Total dan rincian karyawan dalam scope }
  /api/v1/realtime/ws:
    get:
      tags: [Realtime]
      summary: Sambungan WebSocket notifikasi tenant aktif
      operationId: realtimeWebSocket
      description: Cookie sesi dan Origin wajib. Klien memakai hello/resume, ping, dan ack. Setelah reconnect, pulihkan event melalui /notifications/sync. Implementasi saat ini mengirim notification.created dan notification.unread_count.
      x-websocket-close-codes:
        '4401': Sesi tidak sah atau dicabut
        '4408': Hak akses berubah
      responses:
        '101': { description: Koneksi WebSocket diterima }
        '401': { description: Sesi tidak sah }
        '403': { description: Origin, permission, atau entitlement ditolak }
components:
  parameters:
    ResourceID:
      in: path
      name: id
      required: true
      schema: { type: string, minLength: 26, maxLength: 26 }
    LookupType:
      in: path
      name: type
      required: true
      schema:
        type: string
        enum: [regions, offices, divisions, departments, positions, roles, leave-types, shift-templates, document-types, reimbursement-categories, pay-components, banks]
    UserID:
      in: path
      name: id
      required: true
      schema: { type: string, minLength: 26, maxLength: 26 }
    RoleID:
      in: path
      name: id
      required: true
      schema: { type: string, minLength: 26, maxLength: 26 }
    AssignmentID:
      in: path
      name: assignmentId
      required: true
      schema: { type: string, minLength: 26, maxLength: 26 }
    SessionID:
      in: path
      name: sessionId
      required: true
      schema: { type: string, minLength: 26, maxLength: 26 }
    PermissionCode:
      in: path
      name: code
      required: true
      schema: { type: string }
    PerPage:
      in: query
      name: per_page
      schema: { type: integer, minimum: 1, maximum: 100, default: 15 }
    CSRFToken:
      in: header
      name: X-CSRF-Token
      required: true
      schema: { type: string }
    Page:
      in: query
      name: page
      schema: { type: integer, minimum: 1, maximum: 1000000, default: 1 }
    PageSize:
      in: query
      name: pageSize
      schema: { type: integer, minimum: 1, maximum: 100, default: 15 }
    Search:
      in: query
      name: q
      schema: { type: string, maxLength: 100 }
  schemas:
    PayrollTaxBracket:
      type: object
      required: [lower_bound, rate]
      properties:
        category: { type: string, enum: [A, B, C], description: Hanya untuk TER bulanan }
