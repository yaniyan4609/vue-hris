      parameters:
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Search'
      responses:
        '200': { description: Pola mingguan dan bulanan }
    post:
      tags: [Schedule]
      operationId: createSchedulePattern
      x-permission: jadwal.buat
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SchedulePattern' }
      responses:
        '201': { description: Pola dan seluruh slot dibuat atomik }
        '400': { description: Slot tidak lengkap atau shift tidak aktif }
  /api/v1/admin/schedule-patterns/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceID'
    get:
      tags: [Schedule]
      operationId: getSchedulePattern
      x-permission: jadwal.lihat
      responses:
        '200': { description: Pola beserta seluruh slot }
    patch:
      tags: [Schedule]
      operationId: updateSchedulePattern
      x-permission: jadwal.ubah
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SchedulePattern' }
      responses:
        '200': { description: Metadata pola diperbarui dan version bertambah }
        '409': { description: Versi pola telah berubah }
