openapi: 3.0.3
info:
  title: digaji.id API
  version: 0.8.0
  description: >-
    Kontrak endpoint yang sudah tersedia. Endpoint lama dipertahankan selama transisi
    ke spesifikasi REST + WebSocket. Tenant bisnis berasal dari sesi, bukan body atau
    URL. Masuk pada origin yang sama sebelum mencoba endpoint bersesi. Swagger UI
    menambahkan X-CSRF-Token otomatis pada mutasi setelah login. Demo login hanya
    aktif di staging bila diaktifkan pada server. WebSocket didokumentasikan sebagai
    handshake HTTP; pesan dan event dijelaskan pada operasi tersebut. Akun staf
    platform memerlukan TOTP pada login biasa. Tombol demo staging melewati MFA.
servers:
  - url: /
    description: Origin yang sama dengan aplikasi dan sesi cookie
tags:
  - name: Health
    description: Kesehatan dan kesiapan layanan
  - name: Auth
    description: Login, tenant, dan sesi
  - name: Access
    description: Permission, scope, dan hak efektif
  - name: Organization
    description: Master organisasi tenant
  - name: Lookups
    description: Pilihan ringan dengan permission dan scope
  - name: Schedule
    description: Master shift, pola jadwal, dan hari libur
  - name: Employees
    description: Data karyawan dan profil ESS
  - name: Platform
    description: Operasi staf platform
  - name: Notifications
    description: Inbox notifikasi milik akun yang masuk
  - name: Realtime
    description: Handshake dan protokol WebSocket
paths:
  /healthz:
    get:
      tags: [Health]
      summary: Liveness proses API
      operationId: getHealthz
      responses:
        '200': { description: Proses berjalan }
  /readyz:
    get:
      tags: [Health]
      summary: Readiness koneksi database
      operationId: getReadyz
      responses:
        '200': { description: Database siap }
        '503': { description: Database belum siap }
  /api/v1/health:
    get:
      tags: [Health]
      summary: Status proses API
      operationId: getHealth
      responses:
        '200':
          description: Proses berjalan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
  /api/v1/ready:
    get:
      tags: [Health]
      summary: Kesiapan koneksi database
      operationId: getReady
      responses:
        '200':
          description: Database dapat diakses
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        '503':
          description: Database belum siap
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: Masuk dengan email dan kata sandi
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
                remember: { type: boolean, default: false }
      responses:
        '200':
          description: Sesi dibuat dalam cookie HttpOnly; jika ada beberapa tenant, pilih melalui select-tenant
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthState' }
        '401': { description: Email atau kata sandi salah }
  /api/v1/auth/csrf:
    get:
      tags: [Auth]
      summary: Ambil token CSRF untuk aksi bersesi
      operationId: getCSRF
      responses:
        '200':
          description: Token terikat pada sesi; berganti saat token sesi diputar
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      csrf_token: { type: string }
        '401': { description: Sesi tidak sah }
  /api/v1/auth/me:
    get:
      tags: [Auth]
      summary: State sesi saat ini
      operationId: getCurrentSession
      responses:
        '200':
          description: Sesi aktif
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthState' }
        '401': { description: Sesi tidak sah atau berakhir }
  /api/v1/auth/select-tenant:
    post:
      tags: [Auth]
      summary: Pilih tenant yang diikuti pengguna dan putar token sesi
      operationId: selectTenant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tenantId]
              properties:
                tenantId: { type: string }
      responses:
        '200':
          description: Tenant terpilih
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthState' }
        '403': { description: Pengguna bukan anggota tenant tersebut }
  /api/v1/auth/logout:
    post:
      tags: [Auth]
      summary: Cabut sesi saat ini
      operationId: logout
      responses:
        '204': { description: Sesi dicabut }
  /api/v1/auth/sessions:
    get:
      tags: [Auth]
      summary: Daftar perangkat dengan sesi akun yang masih aktif
      operationId: listMySessions
      responses:
        '200':
          description: Maksimal 100 sesi aktif terbaru; sesi ini ditandai current
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [id, deviceLabel, remember, current, createdAt, lastSeenAt]
                  properties:
                    id: { type: string }
                    deviceLabel: { type: string }
                    ip: { type: string }
                    remember: { type: boolean }
                    current: { type: boolean }
                    createdAt: { type: string, format: date-time }
                    lastSeenAt: { type: string, format: date-time }
        '401': { description: Sesi tidak sah atau berakhir }
  /api/v1/auth/logout-all:
    post:
      tags: [Auth]
      summary: Cabut semua sesi akun ini, termasuk perangkat saat ini
      operationId: logoutAll
      responses:
        '204': { description: Semua sesi dicabut dan cookie dibersihkan }
        '401': { description: Sesi tidak sah atau berakhir }
  /api/v1/auth/change-password:
    post:
      tags: [Auth]
      summary: Ganti kata sandi dan cabut sesi di perangkat lain
      operationId: changePassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string, format: password }
                newPassword: { type: string, format: password, minLength: 8 }
      responses:
        '204': { description: Kata sandi berubah; sesi saat ini tetap aktif }
        '400': { description: Kata sandi lama salah, sama dengan yang baru, atau kata sandi baru terlalu pendek }
        '401': { description: Sesi tidak sah atau berakhir }
  /api/v1/auth/demo-accounts:
    get:
      tags: [Auth]
      summary: Daftar akun demo (hanya staging)
      operationId: getDemoAccounts
      responses:
        '200':
          description: Akun demo tersedia
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string }
                    email: { type: string, format: email }
                    label: { type: string }
        '404': { description: Mode demo tidak aktif }
  /api/v1/auth/demo-login:
    post:
      tags: [Auth]
      summary: Masuk cepat ke akun demo (hanya staging)
      operationId: demoLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [account]
              properties:
                account: { type: string, enum: [super, admin, ess] }
      responses:
        '200':
          description: Sesi demo dibuat
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthState' }
        '404': { description: Mode demo tidak aktif }
  /api/v1/admin/capabilities:
    get:
      tags: [Access]
      summary: Izin Admin efektif untuk fitur yang sudah tersedia
      operationId: getAdminCapabilities
      responses:
        '200':
          description: Peta kode permission ke status izin efektif
          content:
            application/json:
              schema:
                type: object
                additionalProperties: { type: boolean }
        '403': { description: Panel Admin tidak tersedia }
  /api/v1/auth/reauth:
    post:
      tags: [Auth]
      summary: Verifikasi ulang kata sandi untuk perubahan akses sensitif
      operationId: reauthenticate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string, format: password }
      responses:
        '200': { description: Bukti verifikasi ulang berlaku selama lima menit dalam sesi saat ini }
        '403': { description: Kata sandi salah }
  /api/v1/auth/switch-tenant:
    post:
      tags: [Auth]
      summary: Pilih tenant dengan kontrak snake_case
      operationId: switchTenant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tenant_id]
              properties:
                tenant_id: { type: string }
      responses:
        '200': { description: Sesi diputar ke tenant terpilih }
        '403': { description: Pengguna bukan anggota tenant }
  /api/v1/auth/password/change:
    post:
      tags: [Auth]
      summary: Ganti kata sandi akun
      operationId: changePasswordCanonical
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password: { type: string, format: password }
                new_password: { type: string, format: password }
      responses:
        '204': { description: Kata sandi berubah; sesi perangkat lain dicabut }
        '400': { description: Kata sandi lama salah atau kebijakan kata sandi tidak terpenuhi }
  /api/v1/auth/password/forgot:
    post:
      tags: [Auth]
      summary: Minta tautan reset kata sandi melalui SMTP
      operationId: forgotPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '202': { description: Respons sama untuk email terdaftar dan tidak terdaftar }
        '503': { description: SMTP belum dikonfigurasi atau pengiriman gagal }
  /api/v1/auth/password/reset:
    post:
      tags: [Auth]
      summary: Gunakan token sekali pakai untuk mengganti kata sandi
      operationId: resetPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, new_password]
              properties:
                token: { type: string }
                new_password: { type: string, format: password }
      responses:
        '204': { description: Kata sandi berubah; seluruh sesi dicabut }
        '400': { description: Token tidak sah atau kata sandi tidak memenuhi kebijakan }
  /api/v1/auth/mfa/status:
    get:
      tags: [Auth]
      summary: Status TOTP sesi staf platform, termasuk sesi yang belum terverifikasi
      operationId: getMFAStatus
      responses:
        '200': { description: Data required dan enrolled }
  /api/v1/auth/mfa/setup:
    post:
      tags: [Auth]
      summary: Buat secret TOTP untuk akun staf platform yang belum terdaftar
      operationId: setupMFA
      responses:
        '200': { description: Secret Base32 dan otpauth_uri; respons tidak disimpan cache }
        '409': { description: Authenticator sudah aktif }
  /api/v1/auth/mfa/confirm:
    post:
      tags: [Auth]
      summary: Konfirmasi TOTP pertama dan terima sepuluh kode pemulihan sekali pakai
      operationId: confirmMFA
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, pattern: '^[0-9]{6}$' }
      responses:
        '200': { description: Sesi terverifikasi; kode pemulihan hanya muncul sekali }
        '403': { description: Kode tidak sah }
  /api/v1/auth/mfa/verify:
    post:
      tags: [Auth]
      summary: Verifikasi TOTP atau kode pemulihan pada login platform
      operationId: verifyMFA
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string }
      responses:
        '200': { description: Sesi platform terverifikasi }
        '403': { description: Kode tidak sah; lima kegagalan mencabut sesi }
  /api/v1/me/sessions:
    get:
      tags: [Auth]
      summary: Daftar sesi perangkat milik akun
      operationId: listMySessionsCanonical
      responses:
        '200': { description: Daftar sesi aktif dalam data }
  /api/v1/me/sessions/{id}:
    delete:
      tags: [Auth]
      summary: Cabut sesi perangkat milik akun
      operationId: revokeMySession
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '204': { description: Sesi dicabut }
        '404': { description: Sesi bukan milik akun }
  /api/v1/me/preferences:
    get:
      tags: [Auth]
      summary: Preferensi tema akun
      operationId: getMyPreferences
      responses:
        '200': { description: Preferensi tema akun }
    patch:
      tags: [Auth]
      summary: Simpan preferensi tema akun
      operationId: updateMyPreferences
      responses:
        '200': { description: Preferensi tema tersimpan }
  /api/v1/me/access:
    get:
      tags: [Access]
      summary: Hak akses efektif akun untuk tenant terpilih
      operationId: getEffectiveAccess
      responses:
        '200':
          description: Keputusan izin tenant dan platform dalam satu batch; perubahan akses berlaku pada request berikutnya
          content:
            application/json:
              schema:
                type: object
                required: [admin, ess, platform, permissions]
                properties:
                  tenantId: { type: string }
                  admin: { type: boolean }
                  ess: { type: boolean }
                  platform: { type: boolean }
                  platformSuperadmin: { type: boolean }
                  platformPermissions:
                    type: object
                    additionalProperties: { $ref: '#/components/schemas/AccessDecision' }
                  entitlements:
                    type: object
                    additionalProperties: { type: boolean }
                  permissions:
                    type: object
                    additionalProperties: { $ref: '#/components/schemas/AccessDecision' }
        '401': { description: Sesi tidak sah atau berakhir }
  /api/v1/admin/access/users:
    get:
      tags: [Access]
      summary: Daftar anggota aktif tenant terpilih
      operationId: listAccessUsers
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Search'
        - in: query
          name: status
          schema: { type: string, enum: [active, disabled] }
      responses:
        '200':
          description: Halaman pengguna dengan jumlah role aktif dan versi akses
          content:
            application/json:
              schema: { type: object, required: [items, total, page, pageSize] }
        '403': { description: Izin pengguna.lihat tidak ada }
  /api/v1/admin/access/roles:
    get:
      tags: [Access]
      summary: Role tenant dan permission yang diberikan oleh tiap role
      operationId: listAccessRoles
      responses:
        '200':
          description: Role yang tersedia untuk dipilih
          content:
            application/json:
              schema: { type: array, items: { type: object } }
        '403': { description: Izin pengguna.lihat tidak ada }
  /api/v1/admin/access/users/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, minLength: 26, maxLength: 26 }
    get:
      tags: [Access]
      summary: Detail anggota, riwayat role, dan izin efektif per permission
      operationId: getAccessUser
      responses:
        '200':
          description: Detail izin dengan sumber, scope, dan override
          content:
            application/json:
              schema: { type: object, required: [user, roles, permissions] }
        '403': { description: Izin pengguna.lihat tidak ada }
        '404': { description: Pengguna bukan anggota aktif tenant terpilih }
  /api/v1/admin/access/users/{id}/roles:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, minLength: 26, maxLength: 26 }
    post:
      tags: [Access]
      summary: Berikan role dalam batas delegasi Admin
      operationId: assignUserRole
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [roleId, currentPassword]
              properties:
                roleId: { type: string }
                validFrom: { type: string, format: date }
                validUntil: { type: string, format: date }
                currentPassword: { type: string, format: password }
      responses:
        '201': { description: Role diberikan, diaudit, dan versi akses naik }
        '403': { description: Diri sendiri, kata sandi salah, atau melebihi hak delegasi }
        '404': { description: Pengguna/role bukan milik tenant terpilih }
        '409': { description: Periode role bertabrakan }
  /api/v1/admin/access/users/{id}/roles/{assignmentId}:
    delete:
      tags: [Access]
      summary: Cabut penugasan role segera dengan riwayat tetap tersimpan
      operationId: revokeUserRole
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
        - in: path
          name: assignmentId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword]
              properties:
                currentPassword: { type: string, format: password }
      responses:
        '204': { description: Role dicabut, diaudit, dan versi akses naik }
        '403': { description: Diri sendiri atau re-autentikasi gagal }
        '404': { description: Penugasan tidak ditemukan di tenant terpilih }
  /api/v1/admin/access/users/{id}/permissions/{code}:
    put:
      tags: [Access]
      summary: Atur override izin per pengguna
      operationId: updateUserPermission
      description: Allow untuk izin berscope memerlukan scope khusus yang sudah disimpan. Aktor harus memiliki izin yang didelegasikan dan scope seluruh tenant untuk izin berscope.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
        - in: path
          name: code
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision, currentPassword]
              properties:
                decision: { type: string, enum: [inherit, allow, deny] }
                currentPassword: { type: string, format: password }
      responses:
        '204': { description: Override berubah, diaudit, dan versi akses naik }
        '400': { description: Izin berscope memerlukan editor scope sebelum Allow }
        '403': { description: Diri sendiri, re-autentikasi gagal, atau delegasi ditolak }
        '404': { description: Pengguna atau permission tidak ditemukan }
  /api/v1/admin/access/scope-options:
    get:
      tags: [Access]
      summary: Pilihan node organisasi untuk editor scope tenant
      operationId: listScopeOptions
      responses:
        '200': { description: Wilayah, kantor, divisi, departemen, dan jabatan }
        '403': { description: Izin pengguna.lihat tidak ada }
  /api/v1/admin/access/preview:
    post:
      tags: [Access]
      summary: Pratinjau izin efektif tanpa menyimpan perubahan
      operationId: previewUserAccess
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId, permissionCode, decision]
              properties:
                userId: { type: string }
                permissionCode: { type: string }
                decision: { type: string, enum: [inherit, allow, deny] }
                rules: { type: array, items: { type: object } }
      responses:
        '200': { description: Keputusan hipotetis beserta sumber dan scope }
        '403': { description: Izin pengguna.lihat tidak ada }
  /api/v1/admin/access/users/{id}/scopes/{code}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
      - in: path
        name: code
        required: true
        schema: { type: string }
    put:
      tags: [Access]
      summary: Simpan aturan scope khusus per permission pengguna
      operationId: updateUserScope
      description: Antaraturan OR, antardimensi dalam satu aturan AND. Membutuhkan re-autentikasi, delegasi seluruh tenant, dan audit.
      responses:
        '204': { description: Scope diubah dan versi akses naik }
        '403': { description: Diri sendiri atau delegasi tidak cukup }
    delete:
      tags: [Access]
      summary: Pulihkan scope bawaan role
      operationId: clearUserScope
      responses:
        '204': { description: Scope khusus dihapus dan versi akses naik }
        '403': { description: Diri sendiri atau delegasi tidak cukup }
  /api/v1/admin/users:
    get:
      tags: [Access]
      summary: Daftar pengguna tenant, termasuk keanggotaan nonaktif
      operationId: listTenantUsers
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Search'
        - { in: query, name: status, schema: { type: string, enum: [active, disabled] } }
        - { in: query, name: role_id, schema: { type: string } }
        - { in: query, name: office_id, schema: { type: string } }
      responses:
        '200': { description: Pengguna dalam data dan metadata halaman }
        '403': { description: Izin pengguna.lihat tidak ada }
    post:
      tags: [Access]
      summary: Tambah akun atau keanggotaan dan kirim undangan
      operationId: createTenantUser
      description: Memerlukan reauth. Saat SMTP belum dikonfigurasi, 503 dikembalikan sebelum data dibuat. Jika pengiriman gagal setelah akun dibuat, invitation_status=failed; admin dapat mengirim ulang lewat reset-password.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, name]
              properties:
                email: { type: string, format: email }
                name: { type: string }
                phone: { type: string }
                employee_id: { type: string }
      responses:
        '201': { description: Akun/keanggotaan dibuat; periksa invitation_status }
        '403': { description: Izin pengguna.buat atau reauth tidak ada }
        '409': { description: Keanggotaan sudah ada atau kuota terlampaui }
        '503': { description: SMTP belum dikonfigurasi }
  /api/v1/admin/users/{id}:
    parameters:
      - $ref: '#/components/parameters/UserID'
    get:
      tags: [Access]
      summary: Detail pengguna, role, hak efektif, dan riwayat
      operationId: getTenantUser
      responses:
        '200': { description: Detail pengguna tenant }
        '404': { description: Pengguna di luar tenant atau tidak ditemukan }
    patch:
      tags: [Access]
      summary: Ubah nama atau telepon akun dengan satu keanggotaan
      operationId: updateTenantUser
      responses:
        '200': { description: Profil akun diperbarui dan diaudit }
        '409': { description: Identitas dipakai di beberapa tenant }
  /api/v1/admin/users/{id}/disable:
    parameters:
      - $ref: '#/components/parameters/UserID'
    post:
      tags: [Access]
      summary: Nonaktifkan keanggotaan tenant dan cabut sesinya
      operationId: disableTenantUser
      responses:
        '204': { description: Keanggotaan nonaktif }
        '403': { description: Tidak boleh menonaktifkan diri sendiri }
  /api/v1/admin/users/{id}/enable:
    parameters:
      - $ref: '#/components/parameters/UserID'
    post:
      tags: [Access]
      summary: Aktifkan kembali keanggotaan tenant
      operationId: enableTenantUser
      responses:
        '204': { description: Keanggotaan aktif }
        '409': { description: Akun dinonaktifkan secara global }
