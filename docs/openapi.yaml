      operationId: previewPayrollTaxBPJSPreflight
      x-permission: penggajian.lihat
      summary: Periksa kelengkapan data pajak dan BPJS sebelum draft payroll
      description: Memeriksa cakupan profil PTKP, kecocokan status PTKP dengan aturan PPh 21, keberlakuan aturan pajak dan BPJS, serta keberadaan nomor tanpa mengungkap nilainya. Belum menghitung pajak/BPJS atau memfinalisasi payroll. Kewajiban program BPJS per tenant belum diputuskan.
      parameters:
        - { in: query, name: employee_id, required: true, schema: { type: string, minLength: 26, maxLength: 26 } }
      responses:
        '200': { description: Tujuh pemeriksaan per karyawan sepanjang periode; tidak mengubah data }
        '404': { description: Periode atau karyawan tidak ditemukan dalam scope payroll }
  /api/v1/ess/loans/simulate:
    post:
