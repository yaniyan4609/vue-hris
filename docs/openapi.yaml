      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version, slots]
              properties:
                version: { type: integer, minimum: 1 }
                slots:
                  type: array
                  items: { $ref: '#/components/schemas/SchedulePatternSlot' }
      responses:
        '200': { description: Seluruh slot diganti dan version bertambah }
        '409': { description: Versi pola telah berubah }
  /api/v1/admin/schedule-patterns/{id}/duplicate:
    parameters:
      - $ref: '#/components/parameters/ResourceID'
    post:
      tags: [Schedule]
      operationId: duplicateSchedulePattern
      x-permission: jadwal.buat
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, name]
              properties:
                code: { type: string }
                name: { type: string }
