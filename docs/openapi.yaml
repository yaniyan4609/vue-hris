  /api/v1/admin/payroll/rules/tax:
    get:
      tags: [Payroll]
      operationId: getPayrollTaxRules
      x-permission: penggajian.lihat
      summary: Baca aturan PPh 21 tenant yang berlaku pada tanggal
      parameters:
        - { in: query, name: date, schema: { type: string, format: date } }
      responses:
        '200': { description: Aturan terstruktur atau configured false }
    post:
      tags: [Payroll]
      operationId: publishPayrollTaxRule
      x-permission: penggajian.kelola
      summary: Terbitkan versi aturan PPh 21 tenant
      description: Perlu reauth. Editor terstruktur memerlukan TER bulanan lengkap untuk kategori A, B, dan C, PTKP, serta rentang tarif tahunan dengan batas atas eksklusif. Sumber aturan wajib dicatat. Versi sebelumnya ditutup atomik; tanggal yang menyentuh payroll final ditolak. Ini penyimpanan aturan, belum mengaktifkan kalkulasi pajak.
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PayrollTaxRuleInput' }
      responses:
        '201': { description: Aturan diterbitkan, audit berisi hash data }
        '403': { description: Reauth diperlukan }
        '409': { description: Versi/tanggal konflik atau payroll sudah final }
  /api/v1/admin/payroll/rules/bpjs:
    get:
      tags: [Payroll]
      operationId: getPayrollBPJSRules
      x-permission: penggajian.lihat
      summary: Baca aturan BPJS tenant yang berlaku pada tanggal
      parameters:
        - { in: query, name: date, schema: { type: string, format: date } }
        - { in: query, name: program, schema: { type: string } }
      responses:
        '200': { description: Daftar aturan aktif per program }
    post:
      tags: [Payroll]
      operationId: publishPayrollBPJSRule
      x-permission: penggajian.kelola
      summary: Terbitkan versi tarif dan plafon BPJS tenant
      description: Perlu reauth. Tarif disimpan sebagai pecahan desimal 0 sampai 1; plafon upah boleh null. Versi sebelumnya ditutup atomik. Tidak ada tarif yang diisi otomatis oleh platform.
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PayrollBPJSRuleInput' }
      responses:
        '201': { description: Versi aturan BPJS diterbitkan dan diaudit }
        '403': { description: Reauth diperlukan }
        '409': { description: Versi/tanggal konflik atau payroll sudah final }
  /api/v1/admin/payroll/components:
    get:
      tags: [Payroll]
      operationId: listPayrollComponents
      x-permission: penggajian.lihat
      parameters:
        - { in: query, name: q, schema: { type: string, maxLength: 100 } }
        - { in: query, name: is_active, schema: { type: boolean } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200': { description: Daftar komponen tenant, termasuk status dan versi }
    post:
      tags: [Payroll]
      operationId: createPayrollComponent
      x-permission: penggajian.kelola
      summary: Buat komponen gaji fixed
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PayrollComponentInput' }
      responses:
        '201': { description: Komponen dibuat dan diaudit }
        '409': { description: Kode komponen sudah digunakan }
  /api/v1/admin/payroll/components/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceID'
    get:
      tags: [Payroll]
      operationId: getPayrollComponent
      x-permission: penggajian.lihat
      responses:
        '200': { description: Detail komponen }
        '404': { description: Komponen tidak ada dalam tenant }
    patch:
      tags: [Payroll]
      operationId: updatePayrollComponent
      x-permission: penggajian.kelola
      summary: Ubah nama, status pajak, atau status aktif
      description: Kode, jenis, dan calc_type tetap. Komponen sistem terkunci. Versi harus cocok; komponen dengan penetapan aktif tidak dapat dinonaktifkan.
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties:
                version: { type: integer, minimum: 1 }
                name: { type: string, minLength: 1, maxLength: 160 }
                taxable: { type: boolean }
                is_active: { type: boolean }
      responses:
        '200': { description: Komponen dan versi baru }
        '409': { description: Versi berubah, komponen sistem, atau masih ditetapkan }
    delete:
      tags: [Payroll]
      operationId: deactivatePayrollComponent
      x-permission: penggajian.kelola
      summary: Nonaktifkan komponen tanpa menghapus riwayat
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '204': { description: Komponen nonaktif, termasuk pengulangan }
        '409': { description: Komponen sistem atau masih ditetapkan }
  /api/v1/admin/employees/{id}/pay-components:
    parameters:
      - $ref: '#/components/parameters/ResourceID'
    get:
      tags: [Payroll]
      operationId: getEmployeePayComponents
      x-permission: penggajian.lihat
      summary: Riwayat komponen gaji karyawan
      description: Nominal menjadi null bila penggajian.lihat_sensitif tidak tersedia untuk karyawan dalam scope.
      responses:
        '200': { description: Riwayat, versi set, dan tanda amounts_masked }
        '404': { description: Karyawan tidak dalam scope payroll }
    put:
      tags: [Payroll]
      operationId: putEmployeePayComponents
      x-permission: penggajian.kelola
      summary: Ganti seluruh set komponen mulai tanggal berlaku
      description: Memerlukan penggajian.lihat_sensitif dalam scope yang sama dan reauth. Set sebelumnya ditutup sehari sebelum valid_from. Tanggal yang menyentuh payroll final dan tanggal yang sudah punya penetapan baru ditolak. Hanya komponen aktif fixed dapat ditetapkan.
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [valid_from, version, components]
              properties:
                valid_from: { type: string, format: date }
                version: { type: integer, minimum: 0 }
                components:
                  type: array
                  maxItems: 100
                  items:
                    type: object
                    required: [component_id, amount]
                    properties:
                      component_id: { type: string, minLength: 26, maxLength: 26 }
                      amount: { type: number, multipleOf: 0.01, exclusiveMinimum: 0 }
      responses:
        '200': { description: Set baru dan versi meningkat, nominal tidak masuk audit }
        '403': { description: Permission sensitif atau reauth tidak ada }
        '404': { description: Karyawan tidak dalam scope }
        '409': { description: Versi konflik, periode final, atau penetapan di masa depan sudah ada }
  /api/v1/admin/payroll/periods:
    get:
      tags: [Payroll]
      operationId: listPayrollPeriods
      x-permission: penggajian.lihat
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200': { description: Periode payroll tenant yang aktif }
    post:
      tags: [Payroll]
      operationId: createPayrollPeriod
      x-permission: penggajian.proses
      summary: Buka periode payroll bulanan
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [year, month]
              properties:
                year: { type: integer, minimum: 2000, maximum: 2100 }
                month: { type: integer, minimum: 1, maximum: 12 }
      responses:
        '201': { description: Periode open dibuat dan diaudit }
        '409': { description: Periode tenant untuk bulan yang sama sudah ada }
  /api/v1/admin/payroll/periods/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceID'
    get:
      tags: [Payroll]
      operationId: getPayrollPeriod
      x-permission: penggajian.lihat
      responses:
        '200': { description: Detail periode dan jumlah run }
        '404': { description: Periode tidak ditemukan dalam tenant }
  /api/v1/admin/payroll/periods/{id}/loan-deductions:
    parameters:
      - $ref: '#/components/parameters/ResourceID'
    get:
      tags: [Payroll]
      operationId: previewPayrollLoanDeductions
      x-permission: penggajian.lihat
      summary: Pratinjau cicilan kasbon untuk periode payroll
      description: Baca saja. Menampilkan cicilan pending yang jatuh tempo sampai akhir periode, tidak terhubung ke baris payroll, dan karyawannya dalam scope. Belum membuat payroll run atau mengurangi outstanding.
      parameters:
        - { in: query, name: loan_id, schema: { type: string, minLength: 26, maxLength: 26 } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200': { description: Daftar cicilan, total nominal, dan preview_only true }
        '404': { description: Periode tidak ditemukan }
  /api/v1/admin/payroll/periods/{id}/loan-deductions/simulate:
    parameters:
      - $ref: '#/components/parameters/ResourceID'
    post:
      tags: [Payroll]
      operationId: simulatePayrollLoanDeductions
      x-permission: penggajian.lihat_sensitif
      summary: Simulasikan potongan kasbon tanpa memotong sebagian cicilan
      description: Memerlukan juga penggajian.lihat dan irisan kedua scope karyawan. available_net diberikan pemanggil sebagai sisa gaji setelah potongan wajib; nilainya belum dihitung server. Hasil tidak mengubah payroll atau kasbon. Jika nominal cicilan tidak cukup, seluruh cicilan ditunda; cicilan berikutnya pada pinjaman yang sama ikut ditunda.
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [employee_id, available_net]
              properties:
                employee_id: { type: string, minLength: 26, maxLength: 26 }
                available_net: { type: number, minimum: 0, multipleOf: 0.01 }
      responses:
        '200': { description: Planned/deferred per cicilan, alasan, sisa net, dan preview_only true }
        '403': { description: Hak melihat payroll sensitif tidak ada }
        '404': { description: Periode atau karyawan tidak ada dalam scope }
        '409': { description: Lebih dari 1000 cicilan perlu ditinjau manual }
  /api/v1/admin/payroll/periods/{id}/proration:
    parameters:
      - $ref: '#/components/parameters/ResourceID'
    get:
      tags: [Payroll]
      operationId: previewPayrollProration
      x-permission: penggajian.lihat
      summary: Periksa kesiapan prorata dari roster terbit
      description: Pembagi adalah jumlah hari shift pada roster terbit sepanjang periode; pembilang adalah hari shift di antara join_date dan end_date karyawan. Setiap tanggal periode harus memiliki roster terbit, termasuk sebelum tanggal masuk, dan join_date harus terisi agar ready true. Respons ini hanya jumlah hari; belum menghitung atau menyimpan nominal gaji.
      parameters:
        - { in: query, name: employee_id, required: true, schema: { type: string, minLength: 26, maxLength: 26 } }
      responses:
        '200': { description: Jumlah hari kalender, roster terbit, hari kerja, hari kerja saat bekerja, dan isu kesiapan }
        '404': { description: Periode atau karyawan tidak ditemukan dalam scope }
  /api/v1/admin/payroll/periods/{id}/preflight:
