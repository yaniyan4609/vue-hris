      operationId: createOfficeGeofence
      summary: Tambah polygon kantor
      x-permission: organisasi.ubah
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Geofence' }
      responses:
        '201': { description: Geofence dibuat }
        '400': { description: Polygon tidak tertutup, berpotongan, atau di luar rentang koordinat }
        '404': { description: Kantor tidak ditemukan }
  /api/v1/admin/geofences/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceID'
    get:
      tags: [Organization]
      operationId: getGeofence
      x-permission: organisasi.lihat
      responses:
        '200': { description: Detail geofence }
        '404': { description: Geofence tidak ditemukan dalam tenant }
    patch:
      tags: [Organization]
      operationId: updateGeofence
      x-permission: organisasi.ubah
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Geofence' }
      responses:
        '200': { description: Geofence diperbarui }
        '400': { description: Geometri tidak valid }
        '404': { description: Geofence tidak ditemukan dalam tenant }
