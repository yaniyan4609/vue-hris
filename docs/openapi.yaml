      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '204': { description: Geofence dinonaktifkan }
        '404': { description: Geofence tidak ditemukan dalam tenant }
  /api/v1/admin/geofences/test-point:
    post:
      tags: [Organization]
      operationId: testGeofencePoint
      summary: Uji titik terhadap polygon aktif tenant
      x-permission: organisasi.lihat
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lat, lng]
              properties:
                lat: { type: number, minimum: -90, maximum: 90 }
                lng: { type: number, minimum: -180, maximum: 180 }
      responses:
        '200': { description: inside dan daftar polygon yang cocok }
  /api/v1/lookups/{type}:
    parameters:
      - $ref: '#/components/parameters/LookupType'
      - $ref: '#/components/parameters/PerPage'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Search'
    get:
      tags: [Lookups]
      operationId: lookupCatalog
      summary: Pilihan master sesuai permission modul
      description: Bank berasal dari kode rekening yang telah ada dan hanya terlihat dalam scope karyawan sensitif pemanggil. Jenis cuti dapat diakses ESS yang berhak mengajukan cuti.
      responses:
        '200': { description: Item id, label, badge dan meta paginasi }
        '403': { description: Permission atau entitlement tidak ada }
        '404': { description: Jenis lookup tidak tersedia }
  /api/v1/lookups/employees:
    get:
      tags: [Lookups]
      operationId: lookupEmployees
      summary: Cari karyawan sesuai permission dan scope tujuan
      parameters:
        - in: query
          name: for
          required: true
          schema: { type: string, enum: [broadcast, roster, approval, leave, contract, document] }
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Search'
      responses:
        '200': { description: Hanya karyawan aktif dalam scope tujuan }
        '400': { description: Parameter for kosong atau tidak dikenal }
        '403': { description: Permission atau entitlement tidak ada }
  /api/v1/admin/shift-templates:
    get:
      tags: [Schedule]
      operationId: listShiftTemplates
      x-permission: jadwal.lihat
      parameters:
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Page'
