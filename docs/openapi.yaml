      x-permission: jadwal.lihat
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [month]
              properties:
                month: { type: string, example: '2026-08' }
      responses:
        '200': { description: Tanggal, slot, dan shift yang akan diterapkan }
        '409': { description: Pola tidak lengkap }
  /api/v1/admin/holidays:
    get:
      tags: [Schedule]
      operationId: listAdminHolidays
      x-permission: jadwal.lihat
      parameters:
        - in: query
          name: year
          schema: { type: integer, minimum: 2000, maximum: 2100 }
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Page'
      responses:
        '200': { description: Hari libur tenant dalam tahun yang dipilih }
    post:
      tags: [Schedule]
      operationId: createHoliday
