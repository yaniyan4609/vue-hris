        '201': { description: Salinan pola dan slot dengan version 1 }
  /api/v1/admin/schedule-patterns/{id}/preview:
    parameters:
      - $ref: '#/components/parameters/ResourceID'
    post:
      tags: [Schedule]
      operationId: previewSchedulePattern
