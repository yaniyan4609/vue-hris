        - $ref: '#/components/parameters/PerPage'
      responses:
        '200': { description: Daftar kasbon sesuai scope karyawan }
    post:
      tags: [Loans]
      operationId: createAdminLoan
      x-permission: kasbon.buat
      summary: Ajukan kasbon atas nama karyawan dalam scope
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
