        effective_to: { type: string, format: date, nullable: true }
        rate_employee: { type: number, minimum: 0, maximum: 1, multipleOf: 0.000001 }
        rate_employer: { type: number, minimum: 0, maximum: 1, multipleOf: 0.000001 }
