            schema: { $ref: '#/components/schemas/Holiday' }
      responses:
        '201': { description: Hari libur dibuat }
  /api/v1/admin/holidays/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceID'
    patch:
      tags: [Schedule]
      operationId: updateHoliday
      x-permission: jadwal.ubah
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Holiday' }
      responses:
        '200': { description: Hari libur diperbarui }
        '404': { description: Hari libur tidak ditemukan dalam tenant }
    delete:
      tags: [Schedule]
      operationId: deleteHoliday
      x-permission: jadwal.ubah
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '204': { description: Hari libur dihapus }
  /api/v1/holidays:
    get:
      tags: [Schedule]
      operationId: listCalendarHolidays
      summary: Hari libur global dan wilayah karyawan untuk kalender
      parameters:
        - in: query
          name: year
          schema: { type: integer, minimum: 2000, maximum: 2100 }
      responses:
        '200': { description: Hari libur untuk tenant dan wilayah karyawan saat ini }
  /api/v1/admin/work-schedules:
    get:
      tags: [Schedule]
      operationId: listWorkSchedules
      x-permission: jadwal.lihat
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - in: query
          name: employee_id
          schema: { type: string }
        - in: query
          name: office_id
          schema: { type: string }
        - in: query
          name: from
          schema: { type: string, format: date }
        - in: query
          name: to
          schema: { type: string, format: date }
        - in: query
          name: status
          schema: { type: string, enum: [draft, published, cancelled] }
      responses:
        '200': { description: Roster dalam scope karyawan; cancelled tersembunyi bila status kosong }
    post:
      tags: [Schedule]
      operationId: createWorkSchedule
      x-permission: jadwal.buat
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkScheduleInput' }
      responses:
        '201': { description: Satu draft roster dibuat }
        '409': { description: Karyawan sudah memiliki roster pada tanggal tersebut }
  /api/v1/admin/work-schedules/bulk:
    post:
      tags: [Schedule]
      operationId: bulkWorkSchedules
      summary: Terapkan pola ke roster draft; dry_run mendeteksi konflik tanpa menulis
      x-permission: jadwal.buat
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [employee_ids, pattern_id, from, to]
              properties:
                employee_ids: { type: array, minItems: 1, maxItems: 50, items: { type: string } }
                pattern_id: { type: string }
                office_id: { type: string, nullable: true }
                from: { type: string, format: date }
                to: { type: string, format: date }
                dry_run: { type: boolean, default: false }
      responses:
        '200': { description: Hasil dry_run atau draft berhasil dibuat, maksimal 200 sel }
        '409': { description: Ada roster pada tanggal tujuan atau pola tidak tersedia }
  /api/v1/admin/work-schedules/publish:
    post:
      tags: [Schedule]
      operationId: publishWorkSchedules
      summary: Terbitkan draft dan materialisasi shift instance serta snapshot aturan
      x-permission: jadwal.publikasi
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [from, to]
              properties:
                from: { type: string, format: date }
                to: { type: string, format: date }
                employee_ids: { type: array, maxItems: 100, items: { type: string } }
      responses:
        '200': { description: Daftar roster dan instance yang diterbitkan, maksimal 200 roster }
        '404': { description: Tidak ada draft dalam rentang dan scope }
        '409': { description: Shift, kantor, atau versi draft berubah }
  /api/v1/admin/work-schedules/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceID'
    get:
      tags: [Schedule]
      operationId: getWorkSchedule
      x-permission: jadwal.lihat
      responses:
        '200': { description: Detail roster dalam scope }
        '404': { description: Tidak ditemukan dalam tenant atau scope }
    patch:
      tags: [Schedule]
      operationId: updateWorkSchedule
      x-permission: jadwal.ubah
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/WorkScheduleInput'
                - type: object
                  required: [version]
                  properties:
                    version: { type: integer, minimum: 1 }
                    reason: { type: string, maxLength: 500 }
      responses:
        '200': { description: Draft diperbarui }
        '409': { description: Versi berubah atau roster sudah diterbitkan }
    delete:
      tags: [Schedule]
      operationId: cancelWorkSchedule
      x-permission: jadwal.hapus
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '204': { description: Draft dibatalkan }
        '409': { description: Roster sudah diterbitkan }
  /api/v1/admin/shift-instances:
    get:
      tags: [Schedule]
      operationId: listShiftInstances
      x-permission: jadwal.lihat
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - in: query
          name: employee_id
          schema: { type: string }
        - in: query
          name: office_id
          schema: { type: string }
        - in: query
          name: from
          schema: { type: string, format: date }
        - in: query
          name: to
          schema: { type: string, format: date }
      responses:
        '200': { description: Instance shift terbit dalam scope, termasuk waktu UTC dan snapshot }
  /api/v1/admin/shift-instances/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceID'
    get:
      tags: [Schedule]
      operationId: getShiftInstance
      x-permission: jadwal.lihat
      responses:
        '200': { description: Detail instance dan snapshot aturan saat publikasi }
        '404': { description: Tidak ditemukan dalam tenant atau scope }
  /api/v1/ess/schedule:
    get:
      tags: [Schedule]
      operationId: getEssSchedule
      summary: Jadwal terbit milik karyawan yang sedang masuk
      parameters:
        - in: query
          name: from
          schema: { type: string, format: date }
        - in: query
          name: to
          schema: { type: string, format: date }
      responses:
        '200': { description: Roster dan instance milik karyawan, maksimum 91 hari }
        '403': { description: Keanggotaan ESS tidak tersedia }
  /api/v1/ess/attendance/today:
    get:
      tags: [Schedule]
      operationId: getEssAttendanceToday
      summary: Shift aktif, event presensi, dan kantor yang diizinkan untuk karyawan saat ini
      responses:
        '200': { description: Tanggal lokal, shift instance bila ada, event, dan kantor diizinkan }
        '404': { description: Akun ESS belum memiliki profil karyawan aktif }
  /api/v1/ess/attendance/location-check:
    post:
      tags: [Schedule]
      operationId: checkEssAttendanceLocation
      summary: Uji titik GPS pada geofence kantor yang sedang diizinkan tanpa menulis event
      description: Ambang akurasi GPS masih keputusan terbuka T-08; respons ini hanya hasil geometri dan tidak memberi izin untuk mencatat presensi.
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lat, lng, accuracy_m]
              properties:
                lat: { type: number, minimum: -90, maximum: 90 }
                lng: { type: number, minimum: -180, maximum: 180 }
                accuracy_m: { type: number, exclusiveMinimum: 0 }
      responses:
        '200': { description: Status inside, outside, flexible, atau unknown }
        '400': { description: Koordinat atau akurasi tidak valid }
  /api/v1/ess/attendance/history:
    get:
      tags: [Schedule]
      operationId: getEssAttendanceHistory
      summary: Event presensi milik sendiri berdasarkan tanggal kerja instance
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - in: query
          name: from
          schema: { type: string, format: date }
        - in: query
          name: to
          schema: { type: string, format: date }
      responses:
        '200': { description: Event milik karyawan, rentang maksimal 93 hari }
  /api/v1/ess/attendance/calendar:
    get:
      tags: [Schedule]
      operationId: getEssAttendanceCalendar
      summary: Status presensi harian milik sendiri
      parameters:
        - in: query
          name: month
          schema: { type: string, pattern: '^\d{4}-\d{2}$', example: '2026-11' }
      responses:
        '200': { description: Data attendance_daily untuk bulan tersebut }
  /api/v1/ess/attendance/summary:
    get:
      tags: [Schedule]
      operationId: getEssAttendanceSummary
      summary: Jumlah hari tercatat, hadir, terlambat, dan menit kerja milik sendiri
      parameters:
        - in: query
          name: month
          schema: { type: string, pattern: '^\d{4}-\d{2}$', example: '2026-11' }
      responses:
        '200': { description: Ringkasan dihitung dari attendance_daily }
  /api/v1/realtime/ws:
    get:
      tags: [Realtime]
      summary: Sambungan WebSocket notifikasi tenant aktif
      operationId: realtimeWebSocket
      description: Cookie sesi dan Origin wajib. Klien memakai hello/resume, ping, dan ack. Setelah reconnect, pulihkan event melalui /notifications/sync. Implementasi saat ini mengirim notification.created dan notification.unread_count.
      x-websocket-close-codes:
        '4401': Sesi tidak sah atau dicabut
        '4408': Hak akses berubah
      responses:
        '101': { description: Koneksi WebSocket diterima }
        '401': { description: Sesi tidak sah }
        '403': { description: Origin, permission, atau entitlement ditolak }
components:
  parameters:
    ResourceID:
      in: path
      name: id
      required: true
      schema: { type: string, minLength: 26, maxLength: 26 }
    LookupType:
      in: path
      name: type
      required: true
      schema:
        type: string
        enum: [regions, offices, divisions, departments, positions, roles, leave-types, shift-templates, document-types, reimbursement-categories, pay-components, banks]
    UserID:
      in: path
      name: id
      required: true
      schema: { type: string, minLength: 26, maxLength: 26 }
    RoleID:
      in: path
      name: id
      required: true
      schema: { type: string, minLength: 26, maxLength: 26 }
    AssignmentID:
      in: path
      name: assignmentId
      required: true
      schema: { type: string, minLength: 26, maxLength: 26 }
    SessionID:
      in: path
      name: sessionId
      required: true
      schema: { type: string, minLength: 26, maxLength: 26 }
    PermissionCode:
      in: path
      name: code
      required: true
      schema: { type: string }
    PerPage:
      in: query
      name: per_page
      schema: { type: integer, minimum: 1, maximum: 100, default: 15 }
    CSRFToken:
      in: header
      name: X-CSRF-Token
      required: true
      schema: { type: string }
    Page:
      in: query
      name: page
      schema: { type: integer, minimum: 1, maximum: 1000000, default: 1 }
    PageSize:
      in: query
      name: pageSize
      schema: { type: integer, minimum: 1, maximum: 100, default: 15 }
    Search:
      in: query
      name: q
      schema: { type: string, maxLength: 100 }
  schemas:
    Geofence:
      type: object
      properties:
        id: { type: string, readOnly: true }
        office_id: { type: string, readOnly: true }
        name: { type: string, maxLength: 160 }
        polygon:
          type: object
          required: [type, coordinates]
          properties:
            type: { type: string, enum: [Polygon] }
            coordinates:
              type: array
              description: Satu cincin tertutup; setiap titik [longitude, latitude]. Lubang polygon belum didukung.
              items:
                type: array
                items:
                  type: array
                  minItems: 2
                  maxItems: 2
                  items: { type: number }
        is_active: { type: boolean, default: true }
    ShiftTemplate:
      type: object
      properties:
        id: { type: string, readOnly: true }
        code: { type: string, maxLength: 48 }
        name: { type: string, maxLength: 160 }
        start_time: { type: string, example: '09:00:00' }
        end_time: { type: string, example: '17:00:00' }
        crosses_midnight: { type: boolean }
        clock_in_window_start_time: { type: string, example: '08:00:00' }
        clock_in_window_start_day_offset: { type: integer, minimum: -1, maximum: 2 }
        clock_in_window_end_time: { type: string, example: '09:30:00' }
        clock_in_window_end_day_offset: { type: integer, minimum: -1, maximum: 2 }
        clock_out_window_start_time: { type: string, example: '16:30:00' }
        clock_out_window_start_day_offset: { type: integer, minimum: -1, maximum: 2 }
        clock_out_window_end_time: { type: string, example: '19:00:00' }
        clock_out_window_end_day_offset: { type: integer, minimum: -1, maximum: 2 }
        late_tolerance_min: { type: integer, minimum: 0 }
        break_minutes: { type: integer, minimum: 0 }
        target_work_minutes: { type: integer, nullable: true }
        flex_time: { type: boolean }
        flex_location: { type: boolean }
        require_location: { type: boolean }
        require_selfie: { type: boolean }
        require_face_recognition: { type: boolean }
        is_pinned: { type: boolean }
        pin_order: { type: integer, nullable: true }
        color_hex: { type: string, pattern: '^#[0-9A-Fa-f]{6}$' }
        is_active: { type: boolean }
    SchedulePatternSlot:
      type: object
      required: [week_no, weekday, day_type]
      properties:
        week_no: { type: integer, minimum: 1, maximum: 5 }
        weekday: { type: integer, minimum: 1, maximum: 7, description: '1=Senin, 7=Minggu' }
        day_type: { type: string, enum: [shift, 'off'] }
        shift_template_id: { type: string, nullable: true }
    SchedulePattern:
      type: object
      properties:
        id: { type: string, readOnly: true }
        code: { type: string, maxLength: 48 }
        name: { type: string, maxLength: 160 }
        pattern_type: { type: string, enum: [weekly, monthly] }
        version: { type: integer, minimum: 1 }
        is_pinned: { type: boolean }
        pin_order: { type: integer, nullable: true }
        is_active: { type: boolean }
        slots:
          type: array
          description: Tepat 7 slot mingguan atau 35 slot bulanan.
          items: { $ref: '#/components/schemas/SchedulePatternSlot' }
    Holiday:
      type: object
      properties:
        id: { type: string, readOnly: true }
        holiday_date: { type: string, format: date }
        name: { type: string, maxLength: 160 }
        holiday_type: { type: string, maxLength: 24 }
        region_id: { type: string, nullable: true }
    WorkScheduleInput:
      type: object
      properties:
        employee_id: { type: string, description: Wajib saat membuat draft; tidak dapat diubah }
        work_date: { type: string, format: date }
        day_type: { type: string, enum: [shift, 'off'] }
        shift_template_id: { type: string, nullable: true }
        office_id: { type: string, nullable: true }
    WorkSchedule:
      allOf:
        - $ref: '#/components/schemas/WorkScheduleInput'
        - type: object
          properties:
            id: { type: string }
            source_pattern_id: { type: string, nullable: true }
            source_pattern_version: { type: integer, nullable: true }
            status: { type: string, enum: [draft, published, cancelled] }
            version: { type: integer }
            published_at: { type: string, format: date-time, nullable: true }
    ShiftInstance:
      type: object
      properties:
        id: { type: string }
        employee_id: { type: string }
        work_schedule_id: { type: string }
        shift_template_id: { type: string }
        office_id: { type: string }
        work_date: { type: string, format: date }
        timezone: { type: string }
        expected_start: { type: string, format: date-time }
        expected_end: { type: string, format: date-time }
        clock_in_window_start_at: { type: string, format: date-time }
        clock_in_window_end_at: { type: string, format: date-time }
        clock_out_window_start_at: { type: string, format: date-time }
        clock_out_window_end_at: { type: string, format: date-time }
        rule_snapshot: { type: object, description: Aturan shift saat roster diterbitkan }
        status: { type: string }
    AllowedOfficeInput:
      type: object
      required: [office_id, valid_from]
      properties:
        office_id: { type: string, minLength: 26, maxLength: 26 }
        valid_from: { type: string, format: date }
        valid_to: { type: string, format: date, nullable: true }
        reason: { type: string, maxLength: 255 }
    AllowedOffice:
      allOf:
        - $ref: '#/components/schemas/AllowedOfficeInput'
        - type: object
          properties:
            id: { type: string }
            employee_id: { type: string }
            office_name: { type: string }
            revoked_at: { type: string, format: date-time, nullable: true }
    Notification:
      type: object
      properties:
        id: { type: string }
        category: { type: string }
        event_type: { type: string }
        title: { type: string }
        body: { type: string }
        deep_link: { type: string, nullable: true }
        priority: { type: string }
        created_at: { type: string, format: date-time }
        read_at: { type: string, format: date-time, nullable: true }
        archived: { type: boolean }
        obsolete: { type: boolean }
    NotificationPage:
      type: object
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Notification' }
        meta:
          type: object
          properties:
            next_cursor: { type: string, nullable: true }
    AccessDecision:
      type: object
      required: [allowed, reason]
      properties:
        allowed: { type: boolean }
        reason: { type: string }
        sources: { type: array, items: { type: string } }
        scopes: { type: array, items: { type: object } }
        override: { type: string, enum: [allow, deny] }
    OrganizationNode:
      type: object
      required: [code, name]
      properties:
        id: { type: string, readOnly: true }
        code: { type: string }
        name: { type: string }
        parentId: { type: string, description: Diperlukan untuk kantor, departemen, dan jabatan }
        timezone: { type: string, description: Khusus kantor }
    OrganizationPage:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/OrganizationNode' }
        total: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }
    Employee:
      type: object
      required: [employeeNumber, displayName, status, baseOfficeId, positionId]
      properties:
        id: { type: string, readOnly: true }
        employeeNumber: { type: string }
        displayName: { type: string }
        status: { type: string, description: Penulisan langsung hanya menerima active, probation, atau leave }
        baseOfficeId: { type: string }
        officeName: { type: string, readOnly: true }
        positionId: { type: string }
        positionName: { type: string, readOnly: true }
        reportsToId: { type: string }
        userId: { type: string, description: Opsional saat membuat; tidak dapat diubah lewat PATCH }
    EmployeePage:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Employee' }
        total: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }
    PlatformTenant:
      type: object
      required: [id, slug, name, status]
      properties:
        id: { type: string }
        slug: { type: string }
        name: { type: string }
        status: { type: string }
    PlatformTenantPage:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/PlatformTenant' }
        total: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }
    Status:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, ready, unavailable]
    AuthState:
      type: object
      required: [user, platform, tenants, remember]
      properties:
        user:
          type: object
          required: [id, email, name]
          properties:
            id: { type: string }
            email: { type: string, format: email }
            name: { type: string }
        platform: { type: boolean }
        mfaRequired: { type: boolean, description: Sesi platform harus menyelesaikan TOTP sebelum mengakses API lain }
        selectedTenantId: { type: string }
        tenants:
          type: array
          items:
            type: object
            required: [id, name, admin, ess]
            properties:
              id: { type: string }
              name: { type: string }
              admin: { type: boolean }
              ess: { type: boolean }
        remember: { type: boolean }
