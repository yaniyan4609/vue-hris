  /api/v1/admin/schedule-patterns/{id}/slots:
    parameters:
      - $ref: '#/components/parameters/ResourceID'
    get:
      tags: [Schedule]
      operationId: getSchedulePatternSlots
      x-permission: jadwal.lihat
