          maxItems: 30
          items:
            type: object
            required: [status, ter_category, annual_amount]
            properties:
              status: { type: string, minLength: 1, maxLength: 16 }
              ter_category: { type: string, enum: [A, B, C] }
              annual_amount: { type: number, minimum: 0, multipleOf: 0.01 }
        ter_brackets: { type: array, minItems: 1, maxItems: 400, items: { $ref: '#/components/schemas/PayrollTaxBracket' } }
        annual_brackets: { type: array, minItems: 1, maxItems: 400, items: { $ref: '#/components/schemas/PayrollTaxBracket' } }
