      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoanInput' }
      responses:
        '200': { description: Cicilan rata, selisih pembulatan pada cicilan terakhir, dan sisa plafon }
        '409': { description: Kebijakan belum diatur atau plafon/tenor terlampaui }
