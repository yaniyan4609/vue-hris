        '200': { description: Roster dalam scope karyawan; cancelled tersembunyi bila status kosong }
    post:
      tags: [Schedule]
      operationId: createWorkSchedule
      x-permission: jadwal.buat
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkScheduleInput' }
      responses:
        '201': { description: Satu draft roster dibuat }
        '409': { description: Karyawan sudah memiliki roster pada tanggal tersebut }
  /api/v1/admin/work-schedules/bulk:
    post:
      tags: [Schedule]
      operationId: bulkWorkSchedules
      summary: Terapkan pola ke roster draft; dry_run mendeteksi konflik tanpa menulis
      x-permission: jadwal.buat
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [employee_ids, pattern_id, from, to]
              properties:
                employee_ids: { type: array, minItems: 1, maxItems: 50, items: { type: string } }
                pattern_id: { type: string }
                office_id: { type: string, nullable: true }
                from: { type: string, format: date }
                to: { type: string, format: date }
                dry_run: { type: boolean, default: false }
      responses:
        '200': { description: Hasil dry_run atau draft berhasil dibuat, maksimal 200 sel }
        '409': { description: Ada roster pada tanggal tujuan atau pola tidak tersedia }
  /api/v1/admin/work-schedules/publish:
    post:
      tags: [Schedule]
      operationId: publishWorkSchedules
      summary: Terbitkan draft dan materialisasi shift instance serta snapshot aturan
      x-permission: jadwal.publikasi
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [from, to]
              properties:
                from: { type: string, format: date }
                to: { type: string, format: date }
                employee_ids: { type: array, maxItems: 100, items: { type: string } }
      responses:
        '200': { description: Daftar roster dan instance yang diterbitkan, maksimal 200 roster }
        '404': { description: Tidak ada draft dalam rentang dan scope }
        '409': { description: Shift, kantor, atau versi draft berubah }
  /api/v1/admin/work-schedules/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceID'
    get:
      tags: [Schedule]
      operationId: getWorkSchedule
      x-permission: jadwal.lihat
      responses:
        '200': { description: Detail roster dalam scope }
        '404': { description: Tidak ditemukan dalam tenant atau scope }
    patch:
      tags: [Schedule]
      operationId: updateWorkSchedule
      x-permission: jadwal.ubah
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/WorkScheduleInput'
                - type: object
                  required: [version]
                  properties:
                    version: { type: integer, minimum: 1 }
                    reason: { type: string, maxLength: 500 }
      responses:
        '200': { description: Draft diperbarui }
        '409': { description: Versi berubah atau roster sudah diterbitkan }
    delete:
      tags: [Schedule]
      operationId: cancelWorkSchedule
      x-permission: jadwal.hapus
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '204': { description: Draft dibatalkan }
        '409': { description: Roster sudah diterbitkan }
  /api/v1/admin/shift-instances:
    get:
      tags: [Schedule]
      operationId: listShiftInstances
      x-permission: jadwal.lihat
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - in: query
          name: employee_id
          schema: { type: string }
        - in: query
          name: office_id
          schema: { type: string }
        - in: query
          name: from
          schema: { type: string, format: date }
        - in: query
          name: to
          schema: { type: string, format: date }
      responses:
        '200': { description: Instance shift terbit dalam scope, termasuk waktu UTC dan snapshot }
  /api/v1/admin/shift-instances/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceID'
    get:
      tags: [Schedule]
      operationId: getShiftInstance
      x-permission: jadwal.lihat
      responses:
        '200': { description: Detail instance dan snapshot aturan saat publikasi }
        '404': { description: Tidak ditemukan dalam tenant atau scope }
  /api/v1/ess/schedule:
    get:
      tags: [Schedule]
      operationId: getEssSchedule
      summary: Jadwal terbit milik karyawan yang sedang masuk
      parameters:
        - in: query
          name: from
          schema: { type: string, format: date }
        - in: query
          name: to
          schema: { type: string, format: date }
      responses:
        '200': { description: Roster dan instance milik karyawan, maksimum 91 hari }
        '403': { description: Keanggotaan ESS tidak tersedia }
  /api/v1/ess/attendance/today:
    get:
      tags: [Schedule]
      operationId: getEssAttendanceToday
      summary: Shift aktif, event presensi, dan kantor yang diizinkan untuk karyawan saat ini
      responses:
        '200': { description: Tanggal lokal, shift instance bila ada, event, dan kantor diizinkan }
        '404': { description: Akun ESS belum memiliki profil karyawan aktif }
  /api/v1/ess/attendance/location-check:
    post:
      tags: [Schedule]
      operationId: checkEssAttendanceLocation
      summary: Uji titik GPS pada geofence kantor yang sedang diizinkan tanpa menulis event
      description: Akurasi GPS di atas 100 meter memberi status unknown dengan reason GPS_ACCURACY_TOO_LOW. Respons ini tidak mencatat presensi.
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lat, lng, accuracy_m]
              properties:
                lat: { type: number, minimum: -90, maximum: 90 }
                lng: { type: number, minimum: -180, maximum: 180 }
                accuracy_m: { type: number, exclusiveMinimum: 0, description: Maksimum 100 meter untuk presensi awal }
      responses:
        '200': { description: Status inside, outside, flexible, atau unknown }
        '400': { description: Koordinat atau akurasi tidak valid }
  /api/v1/ess/attendance/history:
    get:
      tags: [Schedule]
      operationId: getEssAttendanceHistory
      summary: Event presensi milik sendiri berdasarkan tanggal kerja instance
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - in: query
          name: from
          schema: { type: string, format: date }
        - in: query
          name: to
          schema: { type: string, format: date }
      responses:
        '200': { description: Event milik karyawan, rentang maksimal 93 hari }
  /api/v1/ess/attendance/calendar:
    get:
      tags: [Schedule]
      operationId: getEssAttendanceCalendar
      summary: Status presensi harian milik sendiri
      parameters:
        - in: query
          name: month
          schema: { type: string, pattern: '^\d{4}-\d{2}$', example: '2026-11' }
      responses:
        '200': { description: Data attendance_daily untuk bulan tersebut }
  /api/v1/ess/attendance/summary:
    get:
      tags: [Schedule]
      operationId: getEssAttendanceSummary
      summary: Jumlah hari tercatat, hadir, terlambat, dan menit kerja milik sendiri
      parameters:
        - in: query
          name: month
          schema: { type: string, pattern: '^\d{4}-\d{2}$', example: '2026-11' }
      responses:
        '200': { description: Ringkasan dihitung dari attendance_daily }
  /api/v1/admin/approvals/inbox:
    get:
      tags: [Approvals]
      operationId: getApprovalInbox
      x-permission: persetujuan.lihat
      summary: Pengajuan dengan tugas yang ditugaskan kepada pengguna Admin saat ini
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - { in: query, name: request_type, schema: { type: string } }
        - { in: query, name: task_status, schema: { type: string, enum: [pending, approved, rejected, returned, skipped, cancelled] } }
      responses:
        '200': { description: Inbox dibatasi permission, scope, dan assignee }
  /api/v1/admin/approval-flows:
    get:
      tags: [Approvals]
      operationId: listApprovalFlows
      x-permission: pengaturan.lihat
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - { in: query, name: request_type, schema: { type: string } }
      responses:
        '200': { description: Daftar alur approval tenant }
    post:
      tags: [Approvals]
      operationId: createApprovalFlow
      x-permission: pengaturan.kelola
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApprovalFlowInput' }
      responses:
        '201': { description: Alur aktif baru, belum menjadi default dan belum memiliki tahap }
  /api/v1/admin/approval-flows/simulate:
    post:
      tags: [Approvals]
      operationId: simulateApprovalFlow
      x-permission: pengaturan.kelola
      summary: Pratinjau approver efektif, termasuk fallback dan penolakan self approval
      description: Selain pengaturan.kelola, pengguna memerlukan karyawan.lihat dengan scope mencakup employee_id.
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [request_type, employee_id]
              properties:
                request_type: { type: string }
                employee_id: { type: string }
      responses:
        '200': { description: Tahap, kandidat yang berhak, fallback, dan flag resolvable }
        '404': { description: Tidak ada alur default berlaku atau karyawan di luar scope }
  /api/v1/admin/approval-flows/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceID'
    get:
      tags: [Approvals]
      operationId: getApprovalFlow
      x-permission: pengaturan.lihat
      responses:
        '200': { description: Alur beserta seluruh tahap }
        '404': { description: Alur tidak ada dalam tenant }
    patch:
      tags: [Approvals]
      operationId: updateApprovalFlow
      x-permission: pengaturan.kelola
      summary: Ubah metadata alur dengan versi optimistik
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApprovalFlowPatch' }
      responses:
        '200': { description: Alur diperbarui dan diaudit }
        '409': { description: Versi berubah }
    delete:
      tags: [Approvals]
      operationId: deactivateApprovalFlow
      x-permission: pengaturan.kelola
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '204': { description: Alur dinonaktifkan, riwayat instance tetap utuh }
  /api/v1/admin/approval-flows/{id}/steps:
    parameters:
      - $ref: '#/components/parameters/ResourceID'
    put:
      tags: [Approvals]
      operationId: replaceApprovalFlowSteps
      x-permission: pengaturan.kelola
      summary: Ganti seluruh tahap pada alur yang belum dipakai
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version, steps]
              properties:
                version: { type: integer, minimum: 1 }
                steps: { type: array, minItems: 1, maxItems: 10, items: { $ref: '#/components/schemas/ApprovalFlowStep' } }
      responses:
        '200': { description: Versi dan tahap baru }
        '409': { description: Versi berubah atau alur sudah dipakai }
  /api/v1/admin/approval-flows/{id}/set-default:
    parameters:
      - $ref: '#/components/parameters/ResourceID'
    post:
      tags: [Approvals]
      operationId: setDefaultApprovalFlow
      x-permission: pengaturan.kelola
      summary: Jadikan alur aktif dan lengkap sebagai default untuk jenis pengajuan
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '200': { description: Alur default baru; alur default sebelumnya dilepas dan diaudit }
        '409': { description: Alur tidak aktif atau belum memiliki tahap }
  /api/v1/admin/approvals/summary:
    get:
      tags: [Approvals]
      operationId: getApprovalSummary
      x-permission: persetujuan.lihat
      responses:
        '200': { description: Total tugas pending milik pengguna, dikelompokkan menurut jenis pengajuan }
  /api/v1/admin/approvals:
    get:
      tags: [Approvals]
      operationId: listApprovals
      x-permission: persetujuan.lihat
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - { in: query, name: request_type, schema: { type: string } }
        - { in: query, name: status, schema: { type: string } }
        - { in: query, name: from, schema: { type: string, format: date } }
        - { in: query, name: to, schema: { type: string, format: date } }
      responses:
        '200': { description: Semua pengajuan dalam scope karyawan; pengajuan tanpa subjek hanya untuk scope seluruh tenant }
  /api/v1/admin/approvals/{requestId}:
    parameters:
      - in: path
        name: requestId
        required: true
        schema: { type: string, minLength: 26, maxLength: 26 }
    get:
      tags: [Approvals]
      operationId: getApproval
      x-permission: persetujuan.lihat
      responses:
        '200': { description: Pengajuan, approval instance, tugas, riwayat aksi, dan seluruh revisi per percobaan }
        '404': { description: Pengajuan di luar tenant atau scope }
  /api/v1/admin/approvals/{requestId}/actions:
    parameters:
      - { in: path, name: requestId, required: true, schema: { type: string, minLength: 26, maxLength: 26 } }
    post:
      tags: [Approvals]
      operationId: decideApprovalRequest
      summary: Putuskan tugas approval yang ditugaskan kepada pengguna saat ini
      description: Return, approve bertahap/akhir, dan reject tersedia untuk lembur serta cuti. Cuti memotong ledger satu kali per alokasi tahun pada persetujuan akhir. Pengajuan tanpa referensi domain dapat dikembalikan; jenis domain lain menunggu handler. Memerlukan tugas pending, permission approve, dan scope karyawan. Aksi, domain, audit, dan outbox dicatat dalam satu transaksi.
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action, level_no, version]
              properties:
                action: { type: string, enum: [return, approve, reject] }
                reason: { type: string, maxLength: 2000, description: Wajib untuk return dan reject }
                level_no: { type: integer, minimum: 1 }
                version: { type: integer, minimum: 1, description: Versi approval instance }
                data:
                  type: object
                  description: Untuk approve akhir lembur wajib berisi approved_minutes
                  properties:
                    approved_minutes: { type: integer, minimum: 1 }
      responses:
        '200': { description: Versi naik; tugas lain ditutup; tahap berikutnya atau status akhir terisi }
        '403': { description: Bukan assignee atau tanpa permission }
        '409': { description: Versi atau tahap berubah }
  /api/v1/ess/requests:
    get:
      tags: [Approvals]
      operationId: listEssRequests
      summary: Pengajuan yang dibuat akun ESS saat ini
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - { in: query, name: request_type, schema: { type: string } }
        - { in: query, name: status, schema: { type: string } }
      responses:
        '200': { description: Pengajuan pribadi lintas modul }
  /api/v1/ess/requests/{requestId}:
    parameters:
      - in: path
        name: requestId
        required: true
        schema: { type: string, minLength: 26, maxLength: 26 }
    get:
      tags: [Approvals]
      operationId: getEssRequest
      summary: Status dan tahap pengajuan pribadi
      responses:
        '200': { description: Detail status dan seluruh revisi pengajuan pribadi }
        '404': { description: Pengajuan bukan milik akun saat ini }
  /api/v1/ess/requests/{requestId}/resubmit:
    parameters:
      - { in: path, name: requestId, required: true, schema: { type: string, minLength: 26, maxLength: 26 } }
    post:
      tags: [Approvals]
      operationId: resubmitEssRequest
      summary: Kirim ulang pengajuan returned dengan ID yang sama
      description: Menyimpan catatan perbaikan per percobaan dan membentuk ulang tugas tahap pertama dari alur asli. Lembur dapat memperbaiki proposed_minutes/reason. Cuti dapat memperbaiki jenis, tanggal, alasan, dan lampiran; alokasi tahun serta saldo dihitung ulang. Pengajuan tanpa referensi domain menerima note.
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version, correction]
              properties:
                version: { type: integer, minimum: 1, description: Versi request }
                correction:
                  type: object
                  required: [note]
                  additionalProperties: false
                  properties:
                    note: { type: string, minLength: 1, maxLength: 2000 }
                    proposed_minutes: { type: integer, minimum: 1, maximum: 1440, description: Khusus lembur }
                    reason: { type: string, minLength: 1, maxLength: 2000, description: Lembur atau cuti }
                    leave_type_id: { type: string, minLength: 26, maxLength: 26, description: Khusus cuti }
                    start_date: { type: string, format: date, description: Khusus cuti }
                    end_date: { type: string, format: date, description: Khusus cuti }
                    attachment_file_id: { type: string, nullable: true, description: Khusus cuti }
      responses:
        '200': { description: Percobaan dan versi baru pada request yang sama }
        '404': { description: Pengajuan bukan milik karyawan }
        '409': { description: Pengajuan belum returned atau tidak ada approver yang berhak }
  /api/v1/ess/requests/{requestId}/cancel:
    parameters:
      - { in: path, name: requestId, required: true, schema: { type: string, minLength: 26, maxLength: 26 } }
    post:
      tags: [Approvals]
      operationId: cancelEssRequest
      summary: Batalkan pengajuan sendiri yang masih ditinjau atau dikembalikan
      description: Pembatalan domain tersedia untuk lembur dan cuti. Tugas pending, request, instance, data domain, audit, dan outbox diperbarui atomik.
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '200': { description: Pengajuan berstatus cancelled }
        '404': { description: Pengajuan bukan milik karyawan saat ini }
        '409': { description: Status tidak dapat dibatalkan atau handler domain belum tersedia }
  /api/v1/ess/overtime-requests:
    get:
      tags: [Approvals]
      operationId: listEssOvertimeRequests
      summary: Daftar lembur milik karyawan aktif
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - { in: query, name: status, schema: { type: string } }
        - { in: query, name: from, schema: { type: string, format: date } }
        - { in: query, name: to, schema: { type: string, format: date } }
      responses:
        '200': { description: Daftar lembur pribadi dengan proposed, approved, dan paid minutes }
    post:
      tags: [Approvals]
      operationId: submitEssOvertimeRequest
      x-permission: lembur.buat
      summary: Ajukan lembur dan mulai alur approval dalam satu transaksi
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [work_date, proposed_minutes, reason]
              properties:
                work_date: { type: string, format: date }
                proposed_minutes: { type: integer, minimum: 1, maximum: 1440 }
                reason: { type: string, minLength: 1, maxLength: 2000 }
                shift_instance_id: { type: string, nullable: true }
      responses:
        '201': { description: Lembur, request, instance, tugas, audit, dan outbox dibuat }
        '409': { description: Pengajuan aktif sudah ada pada tanggal itu atau approver tidak tersedia }
  /api/v1/ess/overtime-requests/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceID'
    get:
      tags: [Approvals]
      operationId: getEssOvertimeRequest
      responses:
        '200': { description: Detail lembur pribadi }
        '404': { description: Di luar karyawan atau tenant saat ini }
  /api/v1/ess/leave/types:
    get:
      tags: [Approvals]
      operationId: listEssLeaveTypes
      summary: Jenis cuti aktif pada tenant terpilih
      responses:
        '200': { description: Jenis cuti dan kebutuhan lampiran }
  /api/v1/ess/leave/balances:
    get:
      tags: [Approvals]
      operationId: listEssLeaveBalances
      summary: Saldo ledger cuti karyawan per jenis dan tahun
      parameters:
        - { in: query, name: year, schema: { type: integer, minimum: 2000, maximum: 2100 } }
      responses:
        '200': { description: Saldo ledger tahun terpilih; reservasi pengajuan tampil pada preview }
  /api/v1/ess/leave/balances/{leaveTypeId}/ledger:
    parameters:
      - { in: path, name: leaveTypeId, required: true, schema: { type: string, minLength: 26, maxLength: 26 } }
    get:
      tags: [Approvals]
      operationId: listEssLeaveLedger
      parameters:
        - { in: query, name: year, schema: { type: integer, minimum: 2000, maximum: 2100 } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200': { description: Mutasi saldo milik karyawan pada tahun terpilih }
  /api/v1/ess/leave-requests/preview:
    post:
      tags: [Approvals]
      operationId: previewEssLeaveRequest
      summary: Hitung cuti dari roster terbit tanpa menyimpan
      description: Semua tanggal memerlukan roster terbit. Hari shift dihitung per tahun, termasuk saat melintasi 31 Desember. Kebijakan aktif, saldo ledger setelah reservasi, lampiran bersih, dan approver diperiksa. Aturan kelayakan khusus dalam eligibility_json belum aktif dan ditolak sampai evaluator tersedia.
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [leave_type_id, start_date, end_date]
              properties:
                leave_type_id: { type: string, minLength: 26, maxLength: 26 }
                start_date: { type: string, format: date }
                end_date: { type: string, format: date }
                reason: { type: string, maxLength: 2000 }
                attachment_file_id: { type: string, nullable: true }
      responses:
        '200': { description: Hari kerja, alokasi dan saldo setelah per tahun, serta jalur approval }
        '409': { description: Roster, kebijakan, saldo, lampiran, atau approver belum siap }
  /api/v1/ess/leave-requests:
    get:
      tags: [Approvals]
      operationId: listEssLeaveRequests
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200': { description: Pengajuan cuti karyawan aktif }
    post:
      tags: [Approvals]
      operationId: submitEssLeaveRequest
      x-permission: cuti.buat
      summary: Ajukan cuti dengan alokasi saldo per tahun
      description: Validasi preview dihitung ulang setelah karyawan dikunci dalam transaksi. Request, alokasi, approval, audit, dan outbox disimpan atomik. Saldo dipotong saat persetujuan akhir.
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
