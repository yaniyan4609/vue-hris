      tags: [Employees]
      summary: Ubah karyawan dalam scope dan catat audit
      operationId: updateEmployee
      description: Status resigned/terminated belum tersedia; gunakan alur terminasi bertanggal ketika sudah diimplementasikan.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Employee' }
      responses:
        '200':
          description: Karyawan diubah
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Employee' }
        '403': { description: Permission atau scope tidak mencakup data }
  /api/v1/admin/employees/{id}/tax-bpjs:
    parameters:
      - $ref: '#/components/parameters/ResourceID'
    get:
      tags: [Employees]
      operationId: getEmployeeTaxBPJS
      x-permission: karyawan.lihat_sensitif
      summary: Riwayat NPWP, PTKP, dan nomor BPJS karyawan
      description: Membaca nomor sensitif hanya untuk karyawan dalam scope. Gagal tertutup bila master key tidak tersedia.
      responses:
        '200': { description: Seluruh versi bertanggal dan token versi terbaru }
        '404': { description: Karyawan di luar scope }
        '503': { description: Kunci enkripsi tidak tersedia }
    put:
      tags: [Employees]
      operationId: putEmployeeTaxBPJS
      x-permission: karyawan.ubah
      summary: Terbitkan versi baru data pajak dan BPJS karyawan
      description: Memerlukan karyawan.lihat_sensitif dalam scope yang sama dan reauth. Nomor dienkripsi dengan data key per tenant. Versi sebelumnya ditutup sehari sebelum tanggal baru. Data pada payroll final tidak dapat diubah. null menghapus nomor pada versi baru; nomor sebelumnya tidak diwariskan otomatis.
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version, valid_from, ptkp_status]
              properties:
                version: { type: string, description: ID versi terbaru atau string kosong untuk versi pertama }
                valid_from: { type: string, format: date }
                ptkp_status: { type: string, maxLength: 16 }
                npwp: { type: string, nullable: true, pattern: '^[0-9]{1,32}$' }
                bpjs_kes_no: { type: string, nullable: true, pattern: '^[0-9]{1,32}$' }
                bpjs_tk_no: { type: string, nullable: true, pattern: '^[0-9]{1,32}$' }
      responses:
        '200': { description: Versi baru tersimpan, dengan audit tanpa nomor sensitif }
        '409': { description: Konflik versi, tanggal, atau payroll final }
        '503': { description: Kunci enkripsi tidak tersedia }
