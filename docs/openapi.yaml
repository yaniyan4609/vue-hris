      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ShiftTemplate' }
      responses:
        '201': { description: Shift dibuat }
        '400': { description: Waktu, pin, atau warna tidak valid }
        '409': { description: Kode atau urutan pin duplikat }
  /api/v1/admin/shift-templates/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceID'
    get:
      tags: [Schedule]
      operationId: getShiftTemplate
      x-permission: jadwal.lihat
      responses:
        '200': { description: Detail shift }
        '404': { description: Shift tidak ditemukan dalam tenant }
    patch:
      tags: [Schedule]
      operationId: updateShiftTemplate
      summary: Ubah master; instance lama tetap memakai snapshot
      x-permission: jadwal.ubah
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ShiftTemplate' }
      responses:
        '200': { description: Shift diperbarui }
        '400': { description: Data shift tidak valid }
        '404': { description: Shift tidak ditemukan dalam tenant }
    delete:
      tags: [Schedule]
      operationId: deactivateShiftTemplate
      x-permission: jadwal.hapus
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '204': { description: Shift dinonaktifkan, instance lama tetap utuh }
  /api/v1/admin/shift-templates/{id}/duplicate:
    parameters:
      - $ref: '#/components/parameters/ResourceID'
    post:
      tags: [Schedule]
      operationId: duplicateShiftTemplate
      x-permission: jadwal.buat
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, name]
